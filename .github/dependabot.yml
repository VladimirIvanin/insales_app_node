version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
        patterns:
          - '*'
      development:
        dependency-type: development
        patterns:
          - '*'
    # typescript-eslint принимает только TypeScript < 6.1, а 7 — другой компилятор.
    ignore:
      - dependency-name: typescript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
